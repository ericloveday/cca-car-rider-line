<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Rider Dismissal</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  :root {
    --red: #ce1f07;
    --black-side: #1a1a1a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: #0f0f0f;
    color: #fff;
    height: 100%;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: #1a1a1a;
    border-bottom: 3px solid var(--red);
  }
  header h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
  #clock { font-size: 16px; font-weight: 600; color: #ccc; }
  #clearBtn {
    background: none;
    border: 1px solid #555;
    color: #aaa;
    padding: 6px 14px;
    border-radius: 6px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    cursor: pointer;
  }

  #empty {
    text-align: center;
    color: #666;
    font-size: 22px;
    font-weight: 600;
    padding-top: 120px;
  }

  #list {
    padding: 10px;
    column-width: 300px;
    column-gap: 4px;
  }
  .entry {
    break-inside: avoid;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 14px;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.25;
  }
  .entry.black { background: var(--black-side); color: #fff; }
  .entry.red { background: var(--red); color: #fff; }
  .entry .name { flex: 1; padding-right: 10px; }
  .entry .elapsed { font-size: 12px; font-weight: 600; opacity: 0.65; white-space: nowrap; }
  .entry.aging { animation: agingPulse 1.6s ease-in-out infinite; }
  .entry.aging .elapsed { opacity: 1; color: #ffe27a; }
  @keyframes agingPulse {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
    50% { box-shadow: inset 0 0 0 3px rgba(255,255,255,0.55); }
  }
</style>
</head>
<body>

<header>
  <h1>Car rider dismissal</h1>
  <div id="clock"></div>
  <button id="clearBtn" onclick="confirmClear()">Clear list</button>
</header>

<div id="empty">No students in the line yet</div>
<div id="list"></div>

<script>
  // ---- Firebase config: replace with your project's config ----
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const AGING_THRESHOLD_MS = 3.5 * 60 * 1000; // 3.5 minutes

  let entries = [];

  db.ref('carRiderQueue').on('value', (snapshot) => {
    const data = snapshot.val() || {};
    entries = Object.entries(data)
      .map(([key, val]) => ({ key, ...val }))
      .filter(e => e.timestamp)
      .sort((a, b) => a.timestamp - b.timestamp);
    render();
  });

  function render() {
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    if (entries.length === 0) {
      empty.style.display = 'block';
      list.innerHTML = '';
      return;
    }
    empty.style.display = 'none';
    const now = Date.now();
    list.innerHTML = entries.map(e => {
      const ageMs = now - e.timestamp;
      const aging = ageMs > AGING_THRESHOLD_MS;
      const minutes = Math.floor(ageMs / 60000);
      const seconds = Math.floor((ageMs % 60000) / 1000).toString().padStart(2, '0');
      return `
        <div class="entry ${e.side} ${aging ? 'aging' : ''}">
          <span class="name">${escapeHtml(e.name)}</span>
          <span class="elapsed">${minutes}:${seconds}</span>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function confirmClear() {
    if (confirm('Clear the entire car rider list? This cannot be undone.')) {
      db.ref('carRiderQueue').remove();
    }
  }

  function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Re-render every second so elapsed time and aging highlight stay live
  setInterval(render, 1000);
</script>

</body>
</html>
