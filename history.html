<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Rider Dismissal — History</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  :root {
    --red: #ce1f07;
    --black-side: #1a1a1a;
    --recall: #3a3a3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: #0f0f0f;
    color: #fff;
    min-height: 100%;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: #1a1a1a;
    border-bottom: 3px solid var(--red);
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
  #backBtn {
    background: none;
    border: 1px solid #555;
    color: #aaa;
    padding: 6px 14px;
    border-radius: 6px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
  }
  #datePicker {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #datePicker label { font-size: 13px; color: #ccc; font-weight: 600; }
  #dateSelect {
    background: #262626;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 8px 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
  }

  #summary {
    text-align: center;
    padding: 14px 8px 0;
    color: #999;
    font-size: 13px;
    font-weight: 600;
  }

  #board {
    display: flex;
    align-items: stretch;
    min-height: calc(100vh - 120px);
  }
  .side-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .side-section.black,
  .side-section.red {
    border-right: 2px solid #333;
  }
  .side-header {
    text-align: center;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px;
  }
  .side-header.black { background: var(--black-side); color: #fff; }
  .side-header.red { background: var(--red); color: #fff; }
  .side-header.recall { background: var(--recall); color: #fff; }

  .side-empty {
    text-align: center;
    color: #555;
    font-size: 15px;
    font-weight: 600;
    padding-top: 40px;
  }

  .side-list {
    padding: 8px;
    column-width: 260px;
    column-gap: 4px;
    flex: 1;
  }
  .entry {
    break-inside: avoid;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 14px;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 3px;
  }
  .entry.black { background: var(--black-side); color: #fff; }
  .entry.red { background: var(--red); color: #fff; }
  .entry .name { flex: 1; padding-right: 10px; }
  .entry .time {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.65;
    white-space: nowrap;
    margin-right: 8px;
  }
  .entry .grade {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.75;
    white-space: nowrap;
    margin-right: 10px;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(255,255,255,0.18);
  }

  #noHistory {
    text-align: center;
    color: #777;
    font-size: 16px;
    font-weight: 600;
    padding: 80px 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Car Rider Dismissal — History</h1>
  <div id="datePicker">
    <label for="dateSelect">Date:</label>
    <select id="dateSelect" onchange="loadDate(this.value)"></select>
  </div>
  <a id="backBtn" href="javascript:void(0)" onclick="history.back()">Back to live board</a>
</header>

<div id="summary"></div>

<div id="noHistory" style="display:none;">No archived days yet. Use "Clear list" on the live board at the end of a day to save it here.</div>

<div id="board" style="display:none;">
  <div class="side-section black">
    <div class="side-header black">Black side</div>
    <div id="blackEmpty" class="side-empty">No students</div>
    <div id="blackList" class="side-list"></div>
  </div>
  <div class="side-section red">
    <div class="side-header red">Red side</div>
    <div id="redEmpty" class="side-empty">No students</div>
    <div id="redList" class="side-list"></div>
  </div>
  <div class="side-section recall">
    <div class="side-header recall">Recall</div>
    <div id="recallEmpty" class="side-empty">No recalls</div>
    <div id="recallList" class="side-list"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCIlayBhR2uHGmFMopLBBXneL8hqErwb9Q",
    authDomain: "cca-car-rider-line.firebaseapp.com",
    databaseURL: "https://cca-car-rider-line-default-rtdb.firebaseio.com",
    projectId: "cca-car-rider-line",
    storageBucket: "cca-car-rider-line.firebasestorage.app",
    messagingSenderId: "972575925170",
    appId: "1:972575925170:web:093e4b859c525d554a7aab"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  db.ref('carRiderHistory').once('value').then((snapshot) => {
    const data = snapshot.val() || {};
    const dates = Object.keys(data).sort().reverse(); // newest first (YYYY-MM-DD sorts lexically)

    if (dates.length === 0) {
      document.getElementById('noHistory').style.display = 'block';
      document.getElementById('datePicker').style.display = 'none';
      return;
    }

    const select = document.getElementById('dateSelect');
    select.innerHTML = dates.map(d => `<option value="${d}">${formatDateLabel(d)}</option>`).join('');
    loadDate(dates[0]);
  });

  function formatDateLabel(dateKey) {
    // dateKey is YYYY-MM-DD (local); parse as local, not UTC
    const [y, m, d] = dateKey.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function loadDate(dateKey) {
    db.ref('carRiderHistory/' + dateKey).once('value').then((snapshot) => {
      const data = snapshot.val() || {};
      const entries = Object.values(data)
        .filter(e => e.timestamp)
        .sort((a, b) => a.timestamp - b.timestamp);

      document.getElementById('board').style.display = 'flex';

      const active = entries.filter(e => !e.recalled);
      const recalled = entries.filter(e => e.recalled);

      renderSide(active.filter(e => e.side === 'black'), document.getElementById('blackList'), document.getElementById('blackEmpty'));
      renderSide(active.filter(e => e.side === 'red'), document.getElementById('redList'), document.getElementById('redEmpty'));
      renderSide(recalled, document.getElementById('recallList'), document.getElementById('recallEmpty'));

      document.getElementById('summary').textContent =
        `${entries.length} student${entries.length === 1 ? '' : 's'} picked up on ${formatDateLabel(dateKey)}`;
    });
  }

  function renderSide(sideEntries, listEl, emptyEl) {
    if (sideEntries.length === 0) {
      emptyEl.style.display = 'block';
      listEl.innerHTML = '';
      return;
    }
    emptyEl.style.display = 'none';
    listEl.innerHTML = sideEntries.map(e => {
      const gradeBadge = e.grade ? `<span class="grade">${escapeHtml(e.grade)}</span>` : '';
      const timeLabel = e.timestamp
        ? `<span class="time">${new Date(e.timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>`
        : '';
      return `
        <div class="entry ${e.side}">
          <span class="name">${escapeHtml(e.name)}</span>
          ${timeLabel}
          ${gradeBadge}
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
