<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Rider Dismissal</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  :root {
    --red: #ce1f07;
    --black-side: #1a1a1a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: #0f0f0f;
    color: #fff;
    height: 100%;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: #1a1a1a;
    border-bottom: 3px solid var(--red);
  }
  header h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
  #clock { font-size: 16px; font-weight: 600; color: #ccc; }
  #clearBtn {
    background: none;
    border: 1px solid #555;
    color: #aaa;
    padding: 6px 14px;
    border-radius: 6px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    cursor: pointer;
  }

  #board {
    display: flex;
    align-items: stretch;
    min-height: calc(100vh - 60px);
  }
  .side-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .side-section.black { border-right: 2px solid #333; }
  .side-header {
    text-align: center;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px;
  }
  .side-header.black { background: var(--black-side); color: #fff; }
  .side-header.red { background: var(--red); color: #fff; }

  .side-empty {
    text-align: center;
    color: #555;
    font-size: 16px;
    font-weight: 600;
    padding-top: 60px;
  }

  .side-list {
    padding: 8px;
    column-width: 260px;
    column-gap: 4px;
    flex: 1;
  }
  .entry {
    break-inside: avoid;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 14px;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 3px;
  }
  .entry.black { background: var(--black-side); color: #fff; }
  .entry.red { background: var(--red); color: #fff; }
  .entry .name { flex: 1; padding-right: 10px; }
  .entry .grade {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.75;
    white-space: nowrap;
    margin-right: 10px;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(255,255,255,0.18);
  }
  .entry .elapsed { font-size: 12px; font-weight: 600; opacity: 0.65; white-space: nowrap; }
  .entry.aging .elapsed { opacity: 1; color: #ffe27a; }
</style>
</head>
<body>

<header>
  <h1>Car rider dismissal</h1>
  <div id="clock"></div>
  <button id="clearBtn" onclick="confirmClear()">Clear list</button>
</header>

<div id="board">
  <div class="side-section black">
    <div class="side-header black">Black side</div>
    <div id="blackEmpty" class="side-empty">No students yet</div>
    <div id="blackList" class="side-list"></div>
  </div>
  <div class="side-section red">
    <div class="side-header red">Red side</div>
    <div id="redEmpty" class="side-empty">No students yet</div>
    <div id="redList" class="side-list"></div>
  </div>
</div>

<script>
  // ---- Firebase config ----
  const firebaseConfig = {
    apiKey: "AIzaSyCIlayBhR2uHGmFMopLBBXneL8hqErwb9Q",
    authDomain: "cca-car-rider-line.firebaseapp.com",
    databaseURL: "https://cca-car-rider-line-default-rtdb.firebaseio.com",
    projectId: "cca-car-rider-line",
    storageBucket: "cca-car-rider-line.firebasestorage.app",
    messagingSenderId: "972575925170",
    appId: "1:972575925170:web:093e4b859c525d554a7aab"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const AGING_THRESHOLD_MS = 3.5 * 60 * 1000; // 3.5 minutes

  let entries = [];

  db.ref('carRiderQueue').on('value', (snapshot) => {
    const data = snapshot.val() || {};
    entries = Object.entries(data)
      .map(([key, val]) => ({ key, ...val }))
      .filter(e => e.timestamp)
      .sort((a, b) => a.timestamp - b.timestamp);
    render();
  });

  function render() {
    renderSide('black', document.getElementById('blackList'), document.getElementById('blackEmpty'));
    renderSide('red', document.getElementById('redList'), document.getElementById('redEmpty'));
  }

  function renderSide(side, listEl, emptyEl) {
    const sideEntries = entries.filter(e => e.side === side);
    if (sideEntries.length === 0) {
      emptyEl.style.display = 'block';
      listEl.innerHTML = '';
      return;
    }
    emptyEl.style.display = 'none';
    const now = Date.now();
    listEl.innerHTML = sideEntries.map(e => {
      const ageMs = now - e.timestamp;
      const aging = ageMs > AGING_THRESHOLD_MS;
      const minutes = Math.floor(ageMs / 60000);
      const seconds = Math.floor((ageMs % 60000) / 1000).toString().padStart(2, '0');
      const gradeBadge = e.grade ? `<span class="grade">${escapeHtml(e.grade)}</span>` : '';
      return `
        <div class="entry ${side} ${aging ? 'aging' : ''}">
          <span class="name">${escapeHtml(e.name)}</span>
          ${gradeBadge}
          <span class="elapsed">${minutes}:${seconds}</span>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function confirmClear() {
    if (!confirm('Clear the board for a new day? Today\'s list will be saved to history first.')) return;
    const queueRef = db.ref('carRiderQueue');
    queueRef.once('value')
      .then((snapshot) => {
        const data = snapshot.val();
        if (data) {
          const dateKey = new Date().toLocaleDateString('en-CA'); // local YYYY-MM-DD
          return db.ref('carRiderHistory/' + dateKey).update(data);
        }
      })
      .then(() => queueRef.remove())
      .catch(() => {
        alert('Could not save history — the list was left as-is. Try again.');
      });
  }

  function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Re-render every second so elapsed time and aging highlight stay live
  setInterval(render, 1000);
</script>

</body>
</html>
