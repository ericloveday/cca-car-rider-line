<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Rider Dismissal</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  :root {
    --red: #ce1f07;
    --black-side: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: #0f0f0f;
    color: #fff;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    background: #1a1a1a;
    border-bottom: 3px solid var(--red);
  }
  header h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
  #clock { font-size: 18px; font-weight: 600; color: #ccc; }
  #clearBtn {
    background: none;
    border: 1px solid #555;
    color: #aaa;
    padding: 8px 16px;
    border-radius: 6px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }

  #empty {
    text-align: center;
    color: #666;
    font-size: 22px;
    font-weight: 600;
    padding-top: 120px;
  }

  #list {
    padding: 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1c1c1c;
    border-radius: 10px;
    padding: 18px 24px;
    border-left: 8px solid transparent;
  }
  .row.black { border-left-color: var(--black-side); }
  .row.red { border-left-color: var(--red); }
  .row.aging { background: #3a1f1f; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { background: #3a1f1f; }
    50% { background: #4a2626; }
  }
  .name { font-size: 26px; font-weight: 700; }
  .meta { display: flex; align-items: center; gap: 16px; }
  .badge {
    font-size: 13px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 999px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge.black { background: var(--black-side); color: #fff; }
  .badge.red { background: var(--red); color: #fff; }
  .elapsed { font-size: 15px; color: #999; min-width: 54px; text-align: right; }
  .aging .elapsed { color: #ff8a7a; font-weight: 700; }
</style>
</head>
<body>

<header>
  <h1>Car rider dismissal</h1>
  <div id="clock"></div>
  <button id="clearBtn" onclick="confirmClear()">Clear list</button>
</header>

<div id="empty">No students in the line yet</div>
<div id="list"></div>

<script>
  // ---- Firebase config: replace with your project's config ----
 const firebaseConfig = {
  apiKey: "AIzaSyCIlayBhR2uHGmFMopLBBXneL8hqErwb9Q",
  authDomain: "cca-car-rider-line.firebaseapp.com",
  projectId: "cca-car-rider-line",
  storageBucket: "cca-car-rider-line.firebasestorage.app",
  messagingSenderId: "972575925170",
  appId: "1:972575925170:web:093e4b859c525d554a7aab"
};
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const AGING_THRESHOLD_MS = 3.5 * 60 * 1000; // 3.5 minutes

  let entries = [];

  db.ref('carRiderQueue').on('value', (snapshot) => {
    const data = snapshot.val() || {};
    entries = Object.entries(data)
      .map(([key, val]) => ({ key, ...val }))
      .filter(e => e.timestamp)
      .sort((a, b) => a.timestamp - b.timestamp);
    render();
  });

  function render() {
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    if (entries.length === 0) {
      empty.style.display = 'block';
      list.innerHTML = '';
      return;
    }
    empty.style.display = 'none';
    const now = Date.now();
    list.innerHTML = entries.map(e => {
      const ageMs = now - e.timestamp;
      const aging = ageMs > AGING_THRESHOLD_MS;
      const minutes = Math.floor(ageMs / 60000);
      const seconds = Math.floor((ageMs % 60000) / 1000).toString().padStart(2, '0');
      return `
        <div class="row ${e.side} ${aging ? 'aging' : ''}">
          <span class="name">${escapeHtml(e.name)}</span>
          <div class="meta">
            <span class="elapsed">${minutes}:${seconds}</span>
            <span class="badge ${e.side}">${e.side}</span>
          </div>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function confirmClear() {
    if (confirm('Clear the entire car rider list? This cannot be undone.')) {
      db.ref('carRiderQueue').remove();
    }
  }

  function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Re-render every second so elapsed time and aging highlight stay live
  setInterval(render, 1000);
</script>

</body>
</html>
